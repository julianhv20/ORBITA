name: ÓRBITA — Verificación y build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Tipos TypeScript
        run: npm run typecheck

      - name: Simulación de jugabilidad (motor real del cliente)
        run: npm run test:sim

      - name: Build estático
        run: npm run build
